<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self' blob: data:; frame-src blob: data:; object-src 'none'; form-action 'none'; base-uri 'none'">
  <link rel="stylesheet" href="reader.css">
  <title>Reader</title>
</head>
<body>
  <main id="book"></main>
  <nav id="navigation" aria-label="Book navigation">
    <button id="previous" aria-label="Previous page">‹</button>
    <div id="progress">
      <div id="progress-track">
        <div id="progress-fill"></div>
        <div id="chapter-marks" aria-hidden="true"></div>
      </div>
      <input id="progress-slider" type="range" min="0" max="1" step="0.001" value="0"
             aria-label="Reading progress" aria-valuetext="0%">
      <span id="progress-label" aria-live="polite">0%</span>
    </div>
    <button id="next" aria-label="Next page">›</button>
  </nav>
  <script type="module" src="reader.js"></script>
</body>
</html>
